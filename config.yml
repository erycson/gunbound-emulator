    version_max: 440
    product_version: *PRODUCT_VERSION
    users_max: 3000 # max 65535
    event: 0 # 1 = wowlg, é a imagem de fundo do servidor na lista de servidores
    grade_min: 19
    grade_max: -4
    gold_factor: 100
    score_factor: 100
    stats_interval: 300 # Intervalo em segundos que será inserido a quantidade de usuários na tabela UserCount
